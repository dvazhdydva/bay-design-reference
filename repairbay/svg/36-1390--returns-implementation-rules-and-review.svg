<svg width="1100" height="1150" viewBox="0 0 1100 1150" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M5 0.5H1095C1097.49 0.5 1099.5 2.51472 1099.5 5V1145C1099.5 1147.49 1097.49 1149.5 1095 1149.5H5C2.51472 1149.5 0.5 1147.49 0.5 1145V5C0.5 2.51472 2.51471 0.5 5 0.5Z" fill="white"/>
<path d="M5 0.5H1095C1097.49 0.5 1099.5 2.51472 1099.5 5V1145C1099.5 1147.49 1097.49 1149.5 1095 1149.5H5C2.51472 1149.5 0.5 1147.49 0.5 1145V5C0.5 2.51472 2.51471 0.5 5 0.5Z" stroke="#E3EAF0"/>
<text fill="#14263E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="21" font-weight="bold" letter-spacing="0em"><tspan x="33" y="54.6364">Returns &#xb7; review notes</tspan></text>
<text fill="#586E8B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="13" letter-spacing="0em"><tspan x="33" y="93.7273">Editable design examples, not live shipment records. Reuses RepairBay tokens and controls.</tspan></text>
<text fill="#14263E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="15" font-weight="600" letter-spacing="0em"><tspan x="33" y="133.455">Warehouse context</tspan></text>
<text fill="#586E8B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="13" letter-spacing="0em"><tspan x="33" y="171.727">Use the authorized current/home warehouse and persist selection for the session. No cross-company records.</tspan></text>
<text fill="#14263E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="15" font-weight="600" letter-spacing="0em"><tspan x="33" y="211.455">Pending &#x2192; shipment</tspan></text>
<text fill="#586E8B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="13" letter-spacing="0em"><tspan x="33" y="249.727">Return required only. Oldest completed repairs first. Allow individual/group selection. Mixed IW/OOW/DOA selection must be explained and cannot create a mixed </tspan><tspan x="33" y="269.727">shipment.</tspan></text>
<text fill="#14263E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="15" font-weight="600" letter-spacing="0em"><tspan x="33" y="309.455">Shipment status</tspan></text>
<text fill="#586E8B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="13" letter-spacing="0em"><tspan x="33" y="347.727">Done when relevant fields are valid; In progress for partially entered data; Pending for essential missing values. Section badge at the far right; Packing list Add part </tspan><tspan x="33" y="367.727">immediately before it.</tspan></text>
<text fill="#14263E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="15" font-weight="600" letter-spacing="0em"><tspan x="33" y="407.455">Accordion behaviour</tspan></text>
<text fill="#586E8B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="13" letter-spacing="0em"><tspan x="33" y="445.727">Collapse Done sections on page entry only. User-opened sections remain open through edits, saves and completion. Expanded review frame intentionally reveals all </tspan><tspan x="33" y="465.727">fields.</tspan></text>
<text fill="#14263E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="15" font-weight="600" letter-spacing="0em"><tspan x="33" y="505.455">Save and operations</tspan></text>
<text fill="#586E8B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="13" letter-spacing="0em"><tspan x="33" y="543.727">Saved / Unsaved / Saving / failure states follow the repair card. Discard restores saved data. Preserve edits before add/remove operations; do not block deleting a </tspan><tspan x="33" y="563.727">genuinely empty pallet with a false dirty state.</tspan></text>
<text fill="#14263E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="15" font-weight="600" letter-spacing="0em"><tspan x="33" y="603.455">Cargo calculation</tspan></text>
<text fill="#586E8B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="13" letter-spacing="0em"><tspan x="33" y="641.727">Length=max(pallet length, longest box); width=max(pallet width, sum of box widths); height=pallet+highest box only when pallet height is lower, otherwise keep pallet </tspan><tspan x="33" y="661.727">height. Gross=tare+assigned part weights. P1 example: 150&#xd7;200&#xd7;98 cm; 45 kg gross, 25 kg net.</tspan></text>
<text fill="#14263E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="15" font-weight="600" letter-spacing="0em"><tspan x="33" y="701.455">Documents</tspan></text>
<text fill="#586E8B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="13" letter-spacing="0em"><tspan x="33" y="739.727">Preserve commercial invoice generation, record/sent date, return labels and box-only handling symbols. Explain every disabled prerequisite next to its action. Do not </tspan><tspan x="33" y="759.727">invent a manual cargo override until agreed.</tspan></text>
<text fill="#14263E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="15" font-weight="600" letter-spacing="0em"><tspan x="33" y="799.455">Read-only / archive</tspan></text>
<text fill="#586E8B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="13" letter-spacing="0em"><tspan x="33" y="837.727">Courier reference + collection date completes shipment. Archive seven days later. Retain documents and access to details; no editing collected shipments.</tspan></text>
<text fill="#14263E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="15" font-weight="600" letter-spacing="0em"><tspan x="33" y="877.455">Pallet removal</tspan></text>
<text fill="#586E8B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="13" letter-spacing="0em"><tspan x="33" y="915.727">At least one pallet; move assigned parts before deletion. Extra empty pallets removable. Existing maximum four pallets retained. Destructive actions separated from </tspan><tspan x="33" y="935.727">routine controls.</tspan></text>
<text fill="#14263E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="15" font-weight="600" letter-spacing="0em"><tspan x="33" y="975.455">Accessibility</tspan></text>
<text fill="#586E8B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="13" letter-spacing="0em"><tspan x="33" y="1013.73">Keyboard-operable tabs and section disclosures; focus visible; names for selection/trash icons; status conveyed by text as well as colour. No horizontal scrolling at1280 </tspan><tspan x="33" y="1033.73">CSS px.</tspan></text>
<text fill="#14263E" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="15" font-weight="600" letter-spacing="0em"><tspan x="33" y="1073.45">Visual scope</tspan></text>
<text fill="#586E8B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="13" letter-spacing="0em"><tspan x="33" y="1111.73">Inter UI, existing field height, navy headings, green active-section bottom rule. English UI. No production or application code change.</tspan></text>
</svg>
